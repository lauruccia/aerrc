<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 130">

  <!-- ═══ MONOGRAM BOX ═══ -->
  <rect x="0" y="0" width="130" height="130" rx="6" fill="#0D2347"/>
  <!-- Thin gold border, inset -->
  <rect x="7" y="7" width="116" height="116" rx="4" fill="none" stroke="#C9A84C" stroke-width="1.4"/>

  <!-- ARC — italic serif, large, fills box -->
  <text text-anchor="middle" x="65" y="98"
        font-family="Georgia, 'Times New Roman', serif"
        font-style="italic"
        font-size="86" font-weight="700"
        textLength="106" lengthAdjust="spacingAndGlyphs">
    <tspan fill="#C9A84C">A</tspan><tspan fill="#FFFFFF">RC</tspan>
  </text>

  <!-- ═══ WORDMARK ═══ -->
  <!-- EST · 2026 -->
  <text x="153" y="38"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="11.5" fill="#C9A84C" letter-spacing="4.5">EST · 2026</text>

  <!-- Aeroporto — regular -->
  <text x="153" y="74"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="32" font-weight="400" fill="#FFFFFF" letter-spacing="0.3">Aeroporto</text>

  <!-- Reggio Calabria — italic -->
  <text x="153" y="106"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="32" font-weight="400" font-style="italic" fill="#FFFFFF" letter-spacing="0.3">Reggio Calabria</text>

  <!-- Tagline -->
  <text x="154" y="122"
        font-family="Arial, Helvetica, sans-serif"
        font-size="9.5" fill="#FFFFFF" opacity="0.45" letter-spacing="5">VOLI · TURISMO · CALABRIA</text>

</svg>
