  <circle cx="155" cy="580" r="2" fill="#c9a84c" opacity="0.5"/>
  <circle cx="155" cy="620" r="2" fill="#c9a84c" opacity="0.5"/>
  <circle cx="1285" cy="540" r="2" fill="#c9a84c" opacity="0.5"/>
  <circle cx="1285" cy="580" r="2" fill="#c9a84c" opacity="0.5"/>
  <circle cx="1285" cy="620" r="2" fill="#c9a84c" opacity="0.5"/>

