  <text x="549" y="475" font-family="'Helvetica Neue', sans-serif" font-size="7" fill="#c9a84c" opacity="0.8" text-anchor="middle">G2</text>
  <text x="699" y="475" font-family="'Helvetica Neue', sans-serif" font-size="7" fill="#c9a84c" opacity="0.8" text-anchor="middle">G3</text>
  <text x="849" y="475" font-family="'Helvetica Neue', sans-serif" font-size="7" fill="#c9a84c" opacity="0.8" text-anchor="middle">G4</text>
  <text x="999" y="475" font-family="'Helvetica Neue', sans-serif" font-size="7" fill="#c9a84c" opacity="0.8" text-anchor="middle">G5</text>

  <!-- ===== AIRCRAFT ON APRON ===== -->
  <!-- Aircraft 1 — at gate 2 area -->
  <!-- Fuselage -->
  <ellipse cx="430" cy="560" rx="72" ry="12" fill="#152a4e" opacity="0.9" transform="rotate(-5,430,560)"/>
  <!-- Wings -->
