<svg viewBox="0 0 1440 810" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Sky gradient -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#060f1e"/>
      <stop offset="35%" stop-color="#0d1f3c"/>
      <stop offset="70%" stop-color="#1a3a6b"/>
      <stop offset="100%" stop-color="#2a5a8a"/>
    </linearGradient>

    <!-- Golden glow gradient for glass facade -->
    <linearGradient id="glassGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c9a84c" stop-opacity="0.15"/>
      <stop offset="40%" stop-color="#e2c97e" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#c9a84c" stop-opacity="0.08"/>
    </linearGradient>

    <!-- Glass facade gradient -->
    <linearGradient id="glassFacade" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#1a3d6b" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#c9a84c" stop-opacity="0.2"/>
      <stop offset="60%" stop-color="#1a4a8a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0d2a52" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Terminal building gradient -->
    <linearGradient id="terminalGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#152a52"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>

    <!-- Runway gradient -->
    <linearGradient id="runwayGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1f3c"/>
      <stop offset="100%" stop-color="#060d1a"/>
    </linearGradient>

    <!-- Mountain gradient -->
    <linearGradient id="mountainGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a3355" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0d1f3c" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Sea/Stretto gradient -->
    <linearGradient id="seaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a4a7a"/>
      <stop offset="100%" stop-color="#0d2a4a"/>
    </linearGradient>

    <!-- Glow filter for lights -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glassBlur">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>

    <!-- Ambient light reflection on glass -->
    <radialGradient id="ambientLight" cx="0.5" cy="0.3" r="0.6">
      <stop offset="0%" stop-color="#c9a84c" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#c9a84c" stop-opacity="0"/>
    </radialGradient>

    <!-- Clip path for glass panels -->
    <clipPath id="glassClip">
      <polygon points="200,460 1240,420 1240,700 200,700"/>
    </clipPath>
  </defs>

  <!-- ===== SKY ===== -->
  <rect width="1440" height="810" fill="url(#sky)"/>

  <!-- Stars -->
  <circle cx="120" cy="60" r="1.2" fill="white" opacity="0.7"/>
  <circle cx="280" cy="30" r="0.8" fill="white" opacity="0.5"/>
  <circle cx="450" cy="80" r="1" fill="white" opacity="0.6"/>
  <circle cx="650" cy="25" r="1.5" fill="white" opacity="0.4"/>
  <circle cx="820" cy="55" r="0.9" fill="white" opacity="0.7"/>
  <circle cx="990" cy="35" r="1.1" fill="white" opacity="0.5"/>
  <circle cx="1150" cy="70" r="0.8" fill="white" opacity="0.6"/>
  <circle cx="1320" cy="40" r="1.3" fill="white" opacity="0.4"/>
  <circle cx="75"  cy="130" r="0.7" fill="white" opacity="0.5"/>
  <circle cx="380" cy="150" r="1.0" fill="white" opacity="0.4"/>
  <circle cx="560" cy="110" r="0.8" fill="white" opacity="0.6"/>
  <circle cx="780" cy="140" r="1.2" fill="white" opacity="0.3"/>
  <circle cx="1050" cy="120" r="0.9" fill="white" opacity="0.5"/>
  <circle cx="1280" cy="100" r="1.0" fill="white" opacity="0.4"/>
  <circle cx="200" cy="180" r="0.6" fill="white" opacity="0.5"/>
  <circle cx="920" cy="90" r="0.8" fill="white" opacity="0.6"/>

