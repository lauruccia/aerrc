  <line x1="740" y1="390" x2="711" y2="465" stroke="#c9a84c" stroke-width="0.6" opacity="0.35"/>
  <line x1="800" y1="390" x2="769" y2="465" stroke="#c9a84c" stroke-width="0.6" opacity="0.35"/>
  <line x1="860" y1="390" x2="827" y2="465" stroke="#c9a84c" stroke-width="0.6" opacity="0.35"/>
  <line x1="920" y1="390" x2="885" y2="465" stroke="#c9a84c" stroke-width="0.6" opacity="0.35"/>
  <line x1="980" y1="390" x2="943" y2="465" stroke="#c9a84c" stroke-width="0.6" opacity="0.35"/>
  <line x1="1040" y1="390" x2="1001" y2="465" stroke="#c9a84c" stroke-width="0.6" opacity="0.35"/>

  <!-- Glass panel grid lines — horizontal -->
  <line x1="335" y1="405" x2="1103" y2="405" stroke="#e2c97e" stroke-width="0.5" opacity="0.25"/>
  <line x1="330" y1="420" x2="1106" y2="420" stroke="#e2c97e" stroke-width="0.5" opacity="0.25"/>
  <line x1="326" y1="435" x2="1110" y2="435" stroke="#e2c97e" stroke-width="0.5" opacity="0.25"/>
  <line x1="323" y1="450" x2="1113" y2="450" stroke="#e2c97e" stroke-width="0.5" opacity="0.25"/>

  <!-- Glass reflection — warm golden glow from interior lighting -->
