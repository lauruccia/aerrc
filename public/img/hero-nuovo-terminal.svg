  <circle cx="1234" cy="252" r="9" fill="#e2c97e" opacity="0.2" filter="url(#softGlow)"/>
  <!-- Tower base -->
  <rect x="1226" y="388" width="16" height="12" fill="#0a1828"/>

  <!-- ===== SECONDARY WINGS ===== -->
  <!-- Left wing (lower, older section transitioning) -->
  <polygon points="140,465 180,410 340,410 320,465" fill="#0f2040" opacity="0.9"/>
  <line x1="180" y1="410" x2="340" y2="410" stroke="#1a3a6b" stroke-width="1" opacity="0.5"/>
  <!-- Small windows left wing -->
