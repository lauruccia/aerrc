  <!-- Horizon atmospheric glow -->
  <ellipse cx="720" cy="360" rx="580" ry="80" fill="#1a4a8a" opacity="0.25"/>

  <!-- ===== MOUNTAINS / ASPROMONTE (background) ===== -->
  <polygon points="0,460 120,320 250,390 380,300 500,380 620,290 720,350 840,280 960,350 1080,310 1200,380 1320,310 1440,370 1440,520 0,520"
           fill="url(#mountainGrad)" opacity="0.75"/>
  <!-- Mountain ridgeline highlight -->
  <polyline points="0,460 120,320 250,390 380,300 500,380 620,290 720,350 840,280 960,350 1080,310 1200,380 1320,310 1440,370"
            fill="none" stroke="#2a4a7a" stroke-width="1.5" opacity="0.6"/>

  <!-- ===== SEA — STRETTO DI MESSINA ===== -->
