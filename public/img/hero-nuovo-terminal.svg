  <!-- Sea shimmer lines -->
  <line x1="0" y1="490" x2="1440" y2="488" stroke="#3a7aaa" stroke-width="0.8" opacity="0.3"/>
  <line x1="0" y1="500" x2="1440" y2="503" stroke="#3a7aaa" stroke-width="0.5" opacity="0.2"/>
  <line x1="0" y1="515" x2="1440" y2="512" stroke="#3a7aaa" stroke-width="0.7" opacity="0.25"/>
  <!-- Moonlight on water -->
  <ellipse cx="1300" cy="505" rx="90" ry="8" fill="#e2c97e" opacity="0.12"/>

  <!-- ===== GROUND / APRON ===== -->
  <rect x="0" y="530" width="1440" height="280" fill="url(#runwayGrad)"/>

  <!-- Runway markings -->
  <!-- Runway surface -->
  <rect x="580" y="560" width="280" height="200" fill="#0a1828" rx="2"/>
  <!-- Center line dashes -->
  <rect x="717" y="575" width="6" height="28" fill="#c9a84c" opacity="0.6" rx="1"/>
  <rect x="717" y="618" width="6" height="28" fill="#c9a84c" opacity="0.6" rx="1"/>
  <rect x="717" y="661" width="6" height="28" fill="#c9a84c" opacity="0.6" rx="1"/>
  <rect x="717" y="704" width="6" height="24" fill="#c9a84c" opacity="0.6" rx="1"/>
  <!-- Runway edge lights -->
  <circle cx="585" cy="572" r="3" fill="#c9a84c" opacity="0.9" filter="url(#glow)"/>
  <circle cx="585" cy="610" r="3" fill="#c9a84c" opacity="0.8" filter="url(#glow)"/>
  <circle cx="585" cy="648" r="3" fill="#c9a84c" opacity="0.7" filter="url(#glow)"/>
  <circle cx="585" cy="686" r="3" fill="#c9a84c" opacity="0.8" filter="url(#glow)"/>
  <circle cx="855" cy="572" r="3" fill="#c9a84c" opacity="0.9" filter="url(#glow)"/>
  <circle cx="855" cy="610" r="3" fill="#c9a84c" opacity="0.8" filter="url(#glow)"/>
  <circle cx="855" cy="648" r="3" fill="#c9a84c" opacity="0.7" filter="url(#glow)"/>
  <circle cx="855" cy="686" r="3" fill="#c9a84c" opacity="0.8" filter="url(#glow)"/>

  <!-- Apron taxiway lights -->
  <circle cx="200" cy="600" r="2.5" fill="#3a8aff" opacity="0.7"/>
  <circle cx="270" cy="598" r="2.5" fill="#3a8aff" opacity="0.7"/>
  <circle cx="340" cy="600" r="2.5" fill="#3a8aff" opacity="0.7"/>
  <circle cx="1100" cy="598" r="2.5" fill="#3a8aff" opacity="0.7"/>
  <circle cx="1170" cy="600" r="2.5" fill="#3a8aff" opacity="0.7"/>
  <circle cx="1240" cy="598" r="2.5" fill="#3a8aff" opacity="0.7"/>

  <!-- Taxiway yellow line -->
  <path d="M 0,620 Q 400,610 580,600 L 860,600 Q 1000,608 1440,618"
        fill="none" stroke="#c9a84c" stroke-width="1.5" stroke-dasharray="20,12" opacity="0.4"/>

