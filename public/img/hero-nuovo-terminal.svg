  <polygon points="0,470 80,440 160,455 240,435 300,450 380,430 440,448 520,432 600,445 650,430 700,438 750,430 800,440 850,428 920,442 980,432 1040,445 1100,435 1160,448 1220,438 1280,450 1340,440 1400,452 1440,445 1440,490 0,490"
