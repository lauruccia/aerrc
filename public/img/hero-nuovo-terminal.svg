  <!-- Ground perspective lines -->
  <line x1="0" y1="700" x2="1440" y2="660" stroke="#0d2a4a" stroke-width="1" opacity="0.3"/>
  <line x1="0" y1="760" x2="1440" y2="720" stroke="#0a1828" stroke-width="1.5" opacity="0.4"/>

