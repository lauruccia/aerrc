  <line x1="1100" y1="410" x2="1260" y2="410" stroke="#1a3a6b" stroke-width="1" opacity="0.5"/>
  <!-- Small windows right wing -->
  <rect x="1145" y="420" width="22" height="14" fill="#1a4a8a" opacity="0.5" rx="1"/>
  <rect x="1180" y="420" width="22" height="14" fill="#c9a84c" opacity="0.12" rx="1"/>
  <rect x="1215" y="420" width="22" height="14" fill="#1a4a8a" opacity="0.5" rx="1"/>

