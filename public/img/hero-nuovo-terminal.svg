  <line x1="1225" y1="258" x2="1225" y2="284" stroke="#c9a84c" stroke-width="0.5" opacity="0.4"/>
  <line x1="1237" y1="258" x2="1237" y2="284" stroke="#c9a84c" stroke-width="0.5" opacity="0.4"/>
  <line x1="1249" y1="258" x2="1249" y2="284" stroke="#c9a84c" stroke-width="0.5" opacity="0.4"/>
  <!-- Tower beacon -->
