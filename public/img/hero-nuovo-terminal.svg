  <!-- Interior warm light bleeding through glass — lit sections -->
  <polygon points="380,390 440,390 421,465 361,465" fill="#c9a84c" opacity="0.09"/>
  <polygon points="560,390 680,390 655,465 537,465" fill="#e2c97e" opacity="0.11"/>
  <polygon points="760,390 880,390 847,465 727,465" fill="#c9a84c" opacity="0.08"/>
  <polygon points="960,390 1040,390 1001,465 921,465" fill="#e2c97e" opacity="0.10"/>

  <!-- ===== TERMINAL ROOF ===== -->
  <!-- Main roof slab -->
  <polygon points="140,390 180,360 1260,360 1300,390" fill="#0f2244"/>
  <!-- Roof edge detail -->
  <line x1="140" y1="390" x2="1300" y2="390" stroke="#c9a84c" stroke-width="1.2" opacity="0.45"/>
  <!-- Roof fascia / overhang detail -->
  <polygon points="160,380 1280,380 1300,390 140,390" fill="#0a1828" opacity="0.5"/>

